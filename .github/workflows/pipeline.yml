name: CI Pipeline

on:
  pull_request: # Trigger pipeline on pull requests
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering of the workflow
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIRS:         "demo/broken" # Working directories for all stages
  # Utility versions
  TFLINT_VERSION:    "v0.60.0"     # TFLint version to install
  TERRAFORM_VERSION: "1.14.8"      # Terraform version to install
  CHECKOV_VERSION:   "3.2.524"     # Checkov version to install
  TFSEC_VERSION:     "v1.28.14"    # TFSec version to install
  TRIVY_VERSION:     "0.70.0"      # Trivy version to install

  # Automatically defined variables (Don't change anything, all variables are managed by Terraform only!!)
  AWS_S3_BUCKET:     "${{ vars.ARTIFACTS_BUCKET }}"  # AWS S3 bucket to upload logs
  VCS_API_ENDPOINT:  "${{ github.api_url }}"         # VCS API base URL (consumed by the script)
  OIDC_ROLE_ARN:     "${{ vars.OIDC_ROLE_ARN }}"     # The OIDC AWS Role ARN
  JOB_TOKEN:         "${{ secrets.JOB_TOKEN }}"      # The VCS token for API calls
  VCS_PROVIDER:      "${{ vars.VCS_PROVIDER }}"      # The VCS provider
  AI_HANDLER_CREATE: "${{ vars.AI_HANDLER_CREATE }}" # Enable or disable AI Handler
  GITHUB_RUN_URL:    "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"  # The run URL for  GitHub repository

jobs:
  validate-work-dirs:
    name: Validate WORK_DIRS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate WORK_DIRS directories
        shell: bash
        run: |
          echo -e "\033[34mValidating WORK_DIRS directories...\033[0m"
          CLEANED_WORK_DIRS="$(echo "$WORK_DIRS" | tr -d '[:space:]')"
          if [[ -z "$CLEANED_WORK_DIRS" ]]; then
            echo -e "\033[31mWORK_DIRS is empty. Please define at least one existing working directory.\033[0m"
            exit 1
          fi

          IFS=',' read -r -a DIRS <<< "$CLEANED_WORK_DIRS"
          VALID_DIR_COUNT=0
          MISSING_DIRS=()

          for dir in "${DIRS[@]}"; do
            [[ -z "$dir" ]] && continue
            VALID_DIR_COUNT=$((VALID_DIR_COUNT + 1))
            if [[ -d "$dir" ]]; then
              echo -e "\033[32mDirectory exists: $dir\033[0m"
            else
              echo -e "\033[31mDirectory does not exist: $dir\033[0m"
              MISSING_DIRS+=("$dir")
            fi
          done

          if [[ $VALID_DIR_COUNT -eq 0 ]]; then
            echo -e "\033[31mWORK_DIRS does not contain valid directory entries.\033[0m"
            exit 1
          fi

          if [[ ${#MISSING_DIRS[@]} -gt 0 ]]; then
            echo -e "\033[31mOne or more directories from WORK_DIRS do not exist. Failing the pipeline.\033[0m"
            printf 'Missing directories:\n - %s\n' "${MISSING_DIRS[@]}"
            exit 1
          fi

          echo -e "\033[32mAll directories from WORK_DIRS exist.\033[0m"

  setup:
    name: Setup Tools
    runs-on: ubuntu-latest
    needs:
      - validate-work-dirs
    outputs:
      source-sha: ${{ steps.get-sha.outputs.source_sha }} # Output variable for the next job
      # Re-exported so jobs calling run-scanner.yml can read them: a job's `with:`
      # block only sees needs/vars/github/secrets context, not this workflow's
      # own top-level `env:` -- `env.*` isn't resolvable there.
      work-dirs: ${{ steps.export-config.outputs.work_dirs }}
      cache-key: ${{ steps.export-config.outputs.cache_key }}
      tflint-version: ${{ steps.export-config.outputs.tflint_version }}
      trivy-version: ${{ steps.export-config.outputs.trivy_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify preinstalled tools (AWS CLI, jq)
        run: |
          echo -n "AWS CLI Version: "; aws --version || { echo "AWS CLI not found on the runner image"; exit 1; }
          jq --version || { echo "jq not found on the runner image"; exit 1; }

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: &tools-cache
          path: ~/.local
          key: tools-cache-v5-${{ env.CHECKOV_VERSION }}-${{ env.TFSEC_VERSION }}

      - name: Install Tools
        id: setup-status
        run: |
          echo -e "\033[34mChecking if tools are already cached...\033[0m"
          LOCAL_BIN="$HOME/.local/bin"
          export LOCAL_BIN
          if [ -x "$LOCAL_BIN/checkov" ] && [ -x "$LOCAL_BIN/tfsec" ] && python -c "import openai" >/dev/null 2>&1; then
            echo -e "\033[32mTools are already cached. Skipping installation.\033[0m"
            exit 0
          fi

          echo -e "\033[34mInstalling tools...\033[0m"
          mkdir -p "$LOCAL_BIN"

          # Install OpenAI Python library
          echo -e "\033[34mInstalling OpenAI Python library...\033[0m"
          pip install --upgrade pip
          pip install -q --user openai
          echo -e "\033[32mOpenAI library installed successfully.\033[0m"

          # Install Checkov
          echo -e "\033[34mInstalling Checkov...\033[0m"
          pip install -q --user checkov==${CHECKOV_VERSION}
          echo -e "\033[32mCheckov installed successfully.\033[0m"

          # Install TFsec
          echo -e "\033[34mInstalling TFsec...\033[0m"
          curl -L https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64 -o "$LOCAL_BIN/tfsec"
          chmod +x "$LOCAL_BIN/tfsec"
          echo -e "\033[32mTFsec installed successfully.\033[0m"

          # Verify installed tools
          echo -e "\033[34mVerifying installed tools:\033[0m"
          python -c "import openai; print('OpenAI version:', openai.__version__)" || { echo "OpenAI library is not installed"; exit 1; }
          echo -n "Checkov Version: "; checkov --version || { echo "Checkov installation failed"; exit 1; }
          echo -n "TFsec Version: "; tfsec --version || { echo "TFsec installation failed"; exit 1; }

      - name: Get Source Commit SHA
        id: get-sha
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "source_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "source_sha=$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Export shared config for run-scanner.yml callers
        id: export-config
        shell: bash
        run: |
          echo "work_dirs=$WORK_DIRS" >> "$GITHUB_OUTPUT"
          # Cache key built here, once -- run-scanner.yml just takes the
          # finished string, so the format only needs to match the "setup"
          # job's own Restore Tools Cache step in one place, not two.
          echo "cache_key=tools-cache-v5-${CHECKOV_VERSION}-${TFSEC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tflint_version=$TFLINT_VERSION" >> "$GITHUB_OUTPUT"
          echo "trivy_version=$TRIVY_VERSION" >> "$GITHUB_OUTPUT"

  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    needs:
      - setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Terraform Format Check
        run: |
          echo "Starting Terraform format check..."
          terraform fmt -check -recursive || { echo -e "\033[31mTerraform files are not properly formatted. Please run 'terraform fmt -recursive' locally and update your pull request.\033[0m"; exit 1; }
          echo -e "\033[32mTerraform format check passed. All files are properly formatted.\033[0m"

  tflint-analysis:
    name: TFLint Analysis
    needs:
      - setup
      - terraform-fmt
    if: ${{ contains(vars.RUN_TFLINT_ANALYSIS, 'true') }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: TFLint
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'tflint --force --chdir="$dir"'
      pre-command: 'tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
      tflint-version: ${{ needs.setup.outputs.tflint-version }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TERRAFORM_VALIDATE, 'true') && needs.tflint-analysis.result != 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: |
          echo "Starting Terraform validation..."

          # Define paths for logs
          LOG_NAME="terraform_validate.log"
          PLAIN_TEXT_LOG="$GITHUB_WORKSPACE/plain_text_log.txt"
          LOG_FILE_PATH="$GITHUB_WORKSPACE/${LOG_NAME}"
          GITHUB_SHA="${{ needs.setup.outputs.source-sha }}"
          TOOL_NAME="Terraform"
          EXIT_CODE="0"

          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

          echo Check if ${TOOL_NAME} is installed
          terraform --version || { echo -e "\033[31m$TOOL_NAME not found.\033[0m"; exit 1; }

          # Run Terraform validate for each directory in WORK_DIRS
          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          for dir in "${DIRS[@]}"; do
            echo -e "\033[34mRunning $TOOL_NAME init in directory: $dir\n\033[0m"
            # Colored output in pipeline log via stderr; temp.log captures errors for artifact
            terraform -chdir="$dir" init -backend=false 2> >(tee temp.log >&2) || true
            # Process output from Terraform init and update exit code if issues are found
            if [[ -f temp.log && -s temp.log ]]; then
              echo -e "Running $TOOL_NAME validate in directory: $dir\n" >> "${LOG_FILE_PATH}"
              # Four sed passes over Terraform's boxed error output: strip ANSI
              # color codes, drop the top/bottom border lines (╷ ╵), collapse a
              # trailing blank line, then strip the left border (│ ) from what's left.
              sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log | sed '/^╷$/d; /^╵$/d' | sed ':a;N;$!ba;s/\n$//' | sed -r 's/^│ //g' >> "${LOG_FILE_PATH}"
              EXIT_CODE=1 # Indicate that issues were found
            else
              echo -e "\033[32mNo issues were found during $TOOL_NAME init in the directory: $dir.\033[0m"
              echo -e "\033[34mRunning $TOOL_NAME validate in directory: $dir\n\033[0m"
              terraform -chdir="$dir" validate 2> >(tee temp.log >&2) || true
              if [[ -f temp.log && -s temp.log ]]; then
                echo -e "Running $TOOL_NAME validate in directory: $dir\n" >> "${LOG_FILE_PATH}"
                sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log | sed '/^╷$/d; /^╵$/d' | sed ':a;N;$!ba;s/\n$//' | sed -r 's/^│ //g' >> "${LOG_FILE_PATH}"
                EXIT_CODE=1  # Indicate that issues were found
              else
                echo -e "\033[32mNo issues were found during $TOOL_NAME validate in the directory: $dir.\033[0m"
              fi
            fi
          done

          # Determine action based on log content
          if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" ]]; then
            cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
            if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
              echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the comment with the log text.\033[0m"
              ACTION="both"
            else
              echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
              ACTION="post"
            fi
          else
            echo -e "\033[32mLog file is empty. No issues were found during $TOOL_NAME validation.\033[0m"
            echo "$TOOL_NAME validation was successful. No issues were found." > "$PLAIN_TEXT_LOG"
            ACTION="post"
          fi

          PR_NUMBER=${{ github.event.pull_request.number }}

          # Post a comment with the results
          bash "$GITHUB_WORKSPACE/scripts/upload_and_comment.sh" \
            "$VCS_PROVIDER" \
            "$ACTION" \
            "$LOG_FILE_PATH" \
            "$LOG_NAME" \
            "$AWS_S3_BUCKET" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_SHA" \
            "$JOB_TOKEN" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            "$PR_NUMBER" \
            "$OIDC_ROLE_ARN" \
            "$TOOL_NAME" \
            "$PLAIN_TEXT_LOG" \
            "$GITHUB_RUN_URL"

          # Fail the job if errors were found
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME validation completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

  checkov-analysis:
    name: Checkov Analysis
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
    if: ${{ !cancelled() && contains(vars.RUN_CHECKOV_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: Checkov
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'checkov -d "$dir" --config-file "$GITHUB_WORKSPACE/.checkov.yaml" --quiet --framework terraform --download-external-modules false'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  tfsec-analysis:
    name: TFsec Analysis
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TFSEC_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: TFSec
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'tfsec "$dir" --no-module-downloads'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  trivy-analysis:
    name: Trivy Analysis
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
      - tfsec-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TRIVY_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' && needs.tfsec-analysis.result != 'failure' }}
    uses: ./.github/workflows/run-scanner.yml
    with:
      tool-name: Trivy
      work-dirs: ${{ needs.setup.outputs.work-dirs }}
      scanner-command: 'trivy config "$dir" --exit-code 1 --severity HIGH,CRITICAL --format table'
      source-sha: ${{ needs.setup.outputs.source-sha }}
      cache-key: ${{ needs.setup.outputs.cache-key }}
      trivy-version: ${{ needs.setup.outputs.trivy-version }}
    secrets:
      job-token: ${{ secrets.JOB_TOKEN }}
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
      - tfsec-analysis
      - trivy-analysis
    if: ${{ !cancelled() && needs.setup.result == 'success' && contains(vars.RUN_TERRAFORM_PLAN, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' && needs.tfsec-analysis.result != 'failure' && needs.trivy-analysis.result != 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Terraform Plan
        shell: bash
        run: |

          LOG_NAME="terraform_plan.log"
          LOG_FILE_PATH="$GITHUB_WORKSPACE/${LOG_NAME}"
          PLAIN_TEXT_LOG="$GITHUB_WORKSPACE/plain_text_log.txt"
          TOOL_NAME="Terraform plan"
          GITHUB_SHA="${{ needs.setup.outputs.source-sha }}"
          EXIT_CODE=0
          COMMENT_EXIT_CODE=0

          echo -e "\033[34mStarting $TOOL_NAME...\033[0m"
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

          terraform --version || { echo -e "\033[31mTerraform not found.\033[0m"; exit 1; }

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          TARGET_DIR="${DIRS[0]}"

          if [[ ${#DIRS[@]} -gt 1 ]]; then
            echo -e "\033[33mTemporary limitation of the current product version: $TOOL_NAME processes only the first value from WORK_DIRS. Remaining directories will be ignored.\033[0m"
            echo -e "\033[33mIgnored directories:\033[0m"
            for ignored_dir in "${DIRS[@]:1}"; do
              echo -e "\033[33m - ${ignored_dir}\033[0m"
            done
          fi

          echo -e "\033[34mRunning $TOOL_NAME init in directory: $TARGET_DIR\033[0m"
          # `tee >(sed ... >> file)`: process substitution lets the ANSI-stripped copy
          # go to the log file while the original (colored) output still reaches the
          # console via tee's normal stdout. PIPESTATUS[0] is `terraform`'s exit code,
          # not tee's -- same reasoning as PIPESTATUS[0] in run-scanner.yml.
          terraform -chdir="$TARGET_DIR" init -input=false ${{ vars.TERRAFORM_BACKEND_PARAMS }} 2>&1 | tee >(sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$LOG_FILE_PATH")
          EXIT_CODE=${PIPESTATUS[0]}
          if [[ $EXIT_CODE -eq 0 ]]; then
            terraform -chdir="$TARGET_DIR" plan -input=false 2>&1 | tee -a >(sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$LOG_FILE_PATH")
            EXIT_CODE=${PIPESTATUS[0]}
          fi

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo -e "\033[32m$TOOL_NAME completed successfully.\033[0m"
          else
            echo -e "\033[31m$TOOL_NAME completed with errors.\033[0m"
          fi

          cp "$LOG_FILE_PATH" "$PLAIN_TEXT_LOG"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            ACTION="post"
            bash "$GITHUB_WORKSPACE/scripts/upload_and_comment.sh" \
              "$VCS_PROVIDER" \
              "$ACTION" \
              "$LOG_FILE_PATH" \
              "$LOG_NAME" \
              "$AWS_S3_BUCKET" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_REPOSITORY_OWNER" \
              "$GITHUB_HEAD_REF" \
              "$GITHUB_SHA" \
              "$JOB_TOKEN" \
              "$GITHUB_REF" \
              "$GITHUB_RUN_ID" \
              "$PR_NUMBER" \
              "$OIDC_ROLE_ARN" \
              "$TOOL_NAME" \
              "$PLAIN_TEXT_LOG" \
              "$GITHUB_RUN_URL"
            COMMENT_EXIT_CODE=$?
          fi

          if [[ $COMMENT_EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31mFailed to publish $TOOL_NAME comment to PR.\033[0m"
            exit $COMMENT_EXIT_CODE
          fi
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-plan
    if: ${{ !cancelled() && contains(vars.RUN_TERRAFORM_APPLY, 'true') && needs.terraform-plan.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment:
      name: terraform-apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Terraform Apply
        shell: bash
        run: |

          TOOL_NAME="Terraform apply"
          EXIT_CODE=0

          echo -e "\033[34mStarting $TOOL_NAME...\033[0m"

          terraform --version || { echo -e "\033[31mTerraform not found.\033[0m"; exit 1; }

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          TARGET_DIR="${DIRS[0]}"

          if [[ ${#DIRS[@]} -gt 1 ]]; then
            echo -e "\033[33mTemporary limitation of the current product version: $TOOL_NAME processes only the first value from WORK_DIRS. Remaining directories will be ignored.\033[0m"
            echo -e "\033[33mIgnored directories:\033[0m"
            for ignored_dir in "${DIRS[@]:1}"; do
              echo -e "\033[33m - ${ignored_dir}\033[0m"
            done
          fi

          echo -e "\033[34mRunning $TOOL_NAME init with backend in directory: $TARGET_DIR\033[0m"
          terraform -chdir="$TARGET_DIR" init -input=false ${{ vars.TERRAFORM_BACKEND_PARAMS }}
          EXIT_CODE=$?

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo -e "\033[34mRunning $TOOL_NAME in directory: $TARGET_DIR\033[0m"
            terraform -chdir="$TARGET_DIR" apply -input=false -auto-approve
            EXIT_CODE=$?
          fi

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo -e "\033[32m$TOOL_NAME completed successfully.\033[0m"
          else
            echo -e "\033[31m$TOOL_NAME completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi
