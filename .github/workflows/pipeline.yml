  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
      - tfsec-analysis
      - trivy-analysis
    if: ${{ !cancelled() && needs.setup.result == 'success' && contains(vars.RUN_TERRAFORM_PLAN, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' && needs.tfsec-analysis.result != 'failure' && needs.trivy-analysis.result != 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Terraform Plan
        shell: bash
        run: |

          LOG_NAME="terraform_plan.log"
          LOG_FILE_PATH="$GITHUB_WORKSPACE/${LOG_NAME}"
          PLAIN_TEXT_LOG="$GITHUB_WORKSPACE/plain_text_log.txt"
          TOOL_NAME="Terraform plan"
          GITHUB_SHA="${{ needs.setup.outputs.source_sha }}"
          EXIT_CODE=0
          COMMENT_EXIT_CODE=0

          echo -e "\033[34mStarting $TOOL_NAME...\033[0m"
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

          terraform --version || { echo -e "\033[31mTerraform not found.\033[0m"; exit 1; }

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          TARGET_DIR="${DIRS[0]}"

          if [[ ${#DIRS[@]} -gt 1 ]]; then
            echo -e "\033[33mTemporary limitation of the current product version: $TOOL_NAME processes only the first value from WORK_DIRS. Remaining directories will be ignored.\033[0m"
            echo -e "\033[33mIgnored directories:\033[0m"
            for ignored_dir in "${DIRS[@]:1}"; do
              echo -e "\033[33m - ${ignored_dir}\033[0m"
            done
          fi

          echo -e "\033[34mRunning $TOOL_NAME init in directory: $TARGET_DIR\033[0m"
          terraform -chdir="$TARGET_DIR" init -input=false ${{ vars.TERRAFORM_BACKEND_PARAMS }} 2>&1 | tee >(sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$LOG_FILE_PATH")
          EXIT_CODE=${PIPESTATUS[0]}
          if [[ $EXIT_CODE -eq 0 ]]; then
            terraform -chdir="$TARGET_DIR" plan -input=false 2>&1 | tee -a >(sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$LOG_FILE_PATH")
            EXIT_CODE=${PIPESTATUS[0]}
          fi

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo -e "\033[32m$TOOL_NAME completed successfully.\033[0m"
          else
            echo -e "\033[31m$TOOL_NAME completed with errors.\033[0m"
          fi

          cp "$LOG_FILE_PATH" "$PLAIN_TEXT_LOG"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            ACTION="post"
            bash "$GITHUB_WORKSPACE/scripts/upload_and_comment.sh" \
              "$VCS_PROVIDER" \
              "$ACTION" \
              "$LOG_FILE_PATH" \
              "$LOG_NAME" \
              "$AWS_S3_BUCKET" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_REPOSITORY_OWNER" \
              "$GITHUB_HEAD_REF" \
              "$GITHUB_SHA" \
              "$JOB_TOKEN" \
              "$GITHUB_REF" \
              "$GITHUB_RUN_ID" \
              "$PR_NUMBER" \
              "$OIDC_ROLE_ARN" \
              "$TOOL_NAME" \
              "$PLAIN_TEXT_LOG" \
              "$GITHUB_RUN_URL"
            COMMENT_EXIT_CODE=$?
          fi

          if [[ $COMMENT_EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31mFailed to publish $TOOL_NAME comment to PR.\033[0m"
            exit $COMMENT_EXIT_CODE
          fi
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-plan
    if: ${{ !cancelled() && contains(vars.RUN_TERRAFORM_APPLY, 'true') && needs.terraform-plan.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment:
      name: terraform-apply
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Terraform Apply
        shell: bash
        run: |

          TOOL_NAME="Terraform apply"
          EXIT_CODE=0

          echo -e "\033[34mStarting $TOOL_NAME...\033[0m"

          terraform --version || { echo -e "\033[31mTerraform not found.\033[0m"; exit 1; }

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          TARGET_DIR="${DIRS[0]}"

          if [[ ${#DIRS[@]} -gt 1 ]]; then
            echo -e "\033[33mTemporary limitation of the current product version: $TOOL_NAME processes only the first value from WORK_DIRS. Remaining directories will be ignored.\033[0m"
            echo -e "\033[33mIgnored directories:\033[0m"
            for ignored_dir in "${DIRS[@]:1}"; do
              echo -e "\033[33m - ${ignored_dir}\033[0m"
            done
          fi

          echo -e "\033[34mRunning $TOOL_NAME init with backend in directory: $TARGET_DIR\033[0m"
          terraform -chdir="$TARGET_DIR" init -input=false ${{ vars.TERRAFORM_BACKEND_PARAMS }}
          EXIT_CODE=$?

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo -e "\033[34mRunning $TOOL_NAME in directory: $TARGET_DIR\033[0m"
            terraform -chdir="$TARGET_DIR" apply -input=false -auto-approve
            EXIT_CODE=$?
          fi

          if [[ $EXIT_CODE -eq 0 ]]; then
            echo -e "\033[32m$TOOL_NAME completed successfully.\033[0m"
          else
            echo -e "\033[31m$TOOL_NAME completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi
