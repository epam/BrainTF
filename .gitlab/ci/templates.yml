# ──────────────────────────────────────────────────────────────────────────────
# Reusable hidden jobs (templates) for pipeline composition
# ──────────────────────────────────────────────────────────────────────────────

# Tool PATH setup (no AWS credentials)
.path_setup:
  before_script:
    - export PATH="${CI_PROJECT_DIR}/project-tools:$PATH"
    - export PATH="${CI_PROJECT_DIR}/project-tools/aws/bin:$PATH"
    - export PATH="${CI_PROJECT_DIR}/project-tools/checkov/bin:$PATH"
    - export PYTHONPATH="${CI_PROJECT_DIR}/project-tools/openai:${CI_PROJECT_DIR}/project-tools/checkov:$PYTHONPATH"

# OIDC → AWS STS assume-role
.oidc_auth:
  before_script:
    - |
      if [ -n "${OIDC_ROLE_ARN}" ] && [ -n "${VCS_OIDC_TOKEN}" ]; then
        aws_sts_output=$(aws sts assume-role-with-web-identity \
          --role-arn "${OIDC_ROLE_ARN}" \
          --role-session-name "VCSRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
          --web-identity-token "${VCS_OIDC_TOKEN}" \
          --duration-seconds 3600 \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text) || { echo -e "\033[31mFailed to assume role with OIDC.\033[0m"; exit 1; }
        export AWS_ACCESS_KEY_ID=$(echo "$aws_sts_output" | awk '{print $1}')
        export AWS_SECRET_ACCESS_KEY=$(echo "$aws_sts_output" | awk '{print $2}')
        export AWS_SESSION_TOKEN=$(echo "$aws_sts_output" | awk '{print $3}')
      fi

# Combined: tool PATH + AWS OIDC authentication
.path_and_auth:
  before_script:
    - !reference [.path_setup, before_script]
    - !reference [.oidc_auth, before_script]
