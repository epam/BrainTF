include:
  - local: '.gitlab/ci/templates.yml'

image:
  name: python:3.11

stages:
  - validate-work-dirs
  - setup
  - terraform-fmt
  - tflint-analysis
  - terraform-validate
  - checkov-analysis
  - tfsec-analysis
  - trivy-analysis
  - terraform-plan
  - terraform-apply

variables:
  WORK_DIRS:         "demo/broken" # Working directories for all stages
  # Utility versions
  TFLINT_VERSION:    "v0.62.0"     # TFLint version to install
  TERRAFORM_VERSION: "1.14.8"      # Terraform version
  CHECKOV_VERSION:   "3.2.524"     # Checkov version to install
  TFSEC_VERSION:     "v1.28.14"    # TFSec version to install
  TRIVY_VERSION:     "0.70.0"      # Trivy version to install

  # Automatically defined variables (Don't change anything, all variables are managed by Terraform only!!)
  AWS_S3_BUCKET:     "${ARTIFACTS_BUCKET}"  # AWS S3 bucket to upload logs
  VCS_API_ENDPOINT:  "${VCS_API_ENDPOINT}"  # VCS API base URL
  OIDC_ROLE_ARN:     "${OIDC_ROLE_ARN}"     # Replace with your AWS Role ARN
  OIDC_AUDIENCE:     "${OIDC_AUDIENCE}"     # The OIDC AUDIENCE
  JOB_TOKEN:         "${JOB_TOKEN}"         # The VCS token for API calls
  AI_HANDLER_CREATE: "${AI_HANDLER_CREATE}" # Enable or disable AI Handler

validate-work-dirs:
  stage: validate-work-dirs
  extends: .path_setup
  script:
    - |
      if [[ -z "$WORK_DIRS" ]]; then
        echo -e "\033[31mWORK_DIRS is empty.\033[0m"
        exit 1
      fi

      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"

      if [[ ${#DIRS[@]} -eq 0 ]]; then
        echo -e "\033[31mNo directories were parsed from WORK_DIRS: ${WORK_DIRS}\033[0m"
        exit 1
      fi

      HAS_ERRORS=false
      for dir in "${DIRS[@]}"; do
        if [[ -z "$dir" ]]; then
          echo -e "\033[31mWORK_DIRS contains an empty directory entry.\033[0m"
          HAS_ERRORS=true
        elif [[ ! -d "$dir" ]]; then
          echo -e "\033[31mDirectory from WORK_DIRS does not exist: $dir\033[0m"
          HAS_ERRORS=true
        fi
      done

      if [[ "$HAS_ERRORS" == "true" ]]; then
        exit 1
      fi

      echo -e "\033[32mWORK_DIRS validation passed. All directories exist.\033[0m"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $RUN_TERRAFORM_APPLY =~ /^\s*true\s*$/i'

# Install all necessary tools for analysis
setup:
  dependencies:
    - validate-work-dirs
  stage: setup
  script:
    - echo "Checking if tools are already cached..."
    - if [ -d "project-tools" ] && [ -x "project-tools/aws/bin/aws" ] && [ -x "project-tools/tflint" ] && [ -x "project-tools/terraform" ] && [ -x "project-tools/openai" ] && [ -x "project-tools/checkov" ] && [ -x "project-tools/tfsec" ] && [ -x "project-tools/trivy" ] && [ -x "project-tools/jq" ]; then
      echo "Tools are already cached. Skipping installation.";
      exit 0;
      fi

    - echo "Installing tools..."
    - mkdir -p project-tools/aws/bin project-tools

    # Install AWS CLI version 2
    - echo "Installing AWS CLI version 2..."
    - curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip -q -o awscliv2.zip
    - ./aws/install --bin-dir "${CI_PROJECT_DIR}/project-tools/aws/bin" --install-dir "${CI_PROJECT_DIR}/project-tools/aws" --update
    - rm -rf aws awscliv2.zip
    - export PATH="${CI_PROJECT_DIR}/project-tools/aws/bin:$PATH"
    - echo "AWS CLI installed successfully."

    # Install TFLint
    - curl -sL https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip -o tflint.zip
    - unzip -q -o tflint.zip -d project-tools
    - rm -f tflint.zip

    # Install Terraform
    - |
      if [ -e project-tools/terraform ]; then
        rm -f project-tools/terraform
      fi
    - curl -sS https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip -o terraform.zip
    - unzip -q -o terraform.zip -d project-tools
    - rm -f terraform.zip

    # Installing OpenAI library
    - pip install --upgrade pip
    - pip install -q openai --target=${CI_PROJECT_DIR}/project-tools/openai
    - export PYTHONPATH="${CI_PROJECT_DIR}/project-tools/openai:$PYTHONPATH"

    # Install Checkov
    - pip install -q checkov==${CHECKOV_VERSION} --target=${CI_PROJECT_DIR}/project-tools/checkov
    - export PATH="${CI_PROJECT_DIR}/project-tools/checkov/bin:$PATH"
    - export PYTHONPATH="${CI_PROJECT_DIR}/project-tools/checkov:$PYTHONPATH"

    # Install TFsec
    - curl -L https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64 -o project-tools/tfsec
    - chmod +x project-tools/tfsec

    # Install Trivy
    - curl -L https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -o trivy.tar.gz
    - tar -xzf trivy.tar.gz -C project-tools
    - rm -f trivy.tar.gz
    - chmod +x project-tools/trivy

    # Install jq (latest static binary; required by upload_and_comment.sh)
    - curl -L https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64 -o project-tools/jq
    - chmod +x project-tools/jq

    # Add project-tools to PATH
    - export PATH="${CI_PROJECT_DIR}/project-tools:$PATH"

    # Verify installed tools
    - echo "Verifying installed tools:"
    - aws --version || { echo "AWS CLI installation failed"; exit 1; }
    - tflint --version || { echo "TFLint installation failed"; exit 1; }
    - terraform version || { echo "Terraform installation failed"; exit 1; }
    - python -c "import openai; print(openai.__version__)" || { echo "OpenAI library is not installed"; exit 1; }
    - checkov --version || { echo "Checkov installation failed"; exit 1; }
    - tfsec --version  || { echo "TFsec installation failed"; exit 1; }
    - echo -n "Trivy "; trivy --version || { echo "Trivy installation failed"; exit 1; }
    - jq --version || { echo "jq installation failed"; exit 1; }

  cache:
    key: "${CI_COMMIT_REF_SLUG}-tools"
    paths:
      - project-tools/
    policy: pull-push

  artifacts:
    paths:
      - project-tools/ # Save all tools in the project-tools directory as an artifact
    expire_in: 2 days

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Post-merge apply path: tools are required to build plan/apply on main
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $RUN_TERRAFORM_APPLY =~ /^\s*true\s*$/i'

terraform-fmt:
  stage: terraform-fmt
  extends: .path_setup
  dependencies:
    - setup
  script:
    - terraform version || { echo -e "\033[31mTerraform not found in project-tools.\033[0m"; exit 1; }
    - echo "Starting Terraform format check..."
    - terraform fmt -check -recursive || { echo -e "\033[31mTerraform files are not properly formatted. Please run 'terraform fmt -recursive' locally and update your pull request.\033[0m"; exit 1; }
    - echo -e "\033[32mTerraform format check passed. All files are properly formatted.\033[0m"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Run TFLint analysis
tflint-analysis:
  stage: tflint-analysis
  extends: .path_and_auth
  dependencies:
    - setup
  variables:
    TOOL_NAME: "TFLint"
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE
  script:
    - LOG_NAME="tflint_analysis.log" # The log file name for TFLint analysis step
    - LOG_FILE_PATH="${CI_PROJECT_DIR}/${LOG_NAME}" # Path to log file for TFLint analysis step
    - PLAIN_TEXT_LOG="${CI_PROJECT_DIR}/plain_text_log.txt"  # Define the plain text log file path
    - EXIT_CODE=0  # Initialize a variable to store the exit code

    # Run TFLint analysis for each directory and generate individual logs
    - |
      # Check if ${TOOL_NAME} is installed
      tflint --version || { echo -e "\033[31m${TOOL_NAME} not found in project-tools.\033[0m"; exit 1; }

      # Initialize TFLint
      tflint --init --config "${CI_PROJECT_DIR}/.tflint.hcl" || { echo -e "\033[31mFailed to initialize ${TOOL_NAME}.\033[0m"; exit 1; }

      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      for dir in "${DIRS[@]}"; do
        echo -e "\033[34mRunning ${TOOL_NAME} analysis in directory: $dir\n\033[0m"

        # Run TFLint analysis and capture output (colored in pipeline log)
        tflint --force --chdir="$dir" 2>&1 | tee temp.log || true

        # Process output and update exit code if issues are found
        if [[ -f temp.log && -s temp.log ]]; then
          echo -e "Running ${TOOL_NAME} analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log >> "${LOG_FILE_PATH}"
          EXIT_CODE=1  # Indicate that issues were found
        else
          echo -e "\033[32mNo issues were found during ${TOOL_NAME} analysis in the directory: $dir.\033[0m"
        fi
      done

      # Determine action based on log file content
    - |
      if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" ]]; then
        cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
        if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
          echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the note with the log text.\033[0m"
          ACTION="both"
        else
          echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
          ACTION="post"
        fi
      else
        echo -e "\033[32mLog file is empty. No issues were found during ${TOOL_NAME} analysis.\033[0m"
        echo "${TOOL_NAME} analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
        ACTION="post"
      fi

    # Post a comment with the results
    - bash "${CI_PROJECT_DIR}/scripts/upload_and_comment.sh" \
      "$VCS_PROVIDER" \
      "$ACTION" \
      "$LOG_FILE_PATH" \
      "$LOG_NAME" \
      "$AWS_S3_BUCKET" \
      "$CI_PROJECT_NAME" \
      "$CI_PROJECT_NAMESPACE" \
      "$CI_COMMIT_REF_NAME" \
      "$CI_COMMIT_SHA" \
      "$JOB_TOKEN" \
      "$CI_PROJECT_ID" \
      "$CI_PIPELINE_ID" \
      "$CI_MERGE_REQUEST_IID" \
      "$OIDC_ROLE_ARN" \
      "$TOOL_NAME" \
      "$PLAIN_TEXT_LOG" \
      "$CI_JOB_URL"

    # Fail the job if errors were found
    - |
      if [[ $EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31m${TOOL_NAME} analysis completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $RUN_TFLINT_ANALYSIS =~ /^\s*true\s*$/i'

# Run Terraform Validate
terraform-validate:
  stage: terraform-validate
  extends: .path_and_auth
  dependencies:
    - setup
  variables:
    TOOL_NAME: "Terraform"
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE
  script:
    - LOG_NAME="terraform_validate.log" # The log file name for Terraform validate step
    - LOG_FILE_PATH="${CI_PROJECT_DIR}/${LOG_NAME}" # Path to log file Terraform validate step
    - PLAIN_TEXT_LOG="${CI_PROJECT_DIR}/plain_text_log.txt"  # Define the plain text log file path
    - EXIT_CODE=0  # Initialize a variable to store the exit code

    # Run Terraform Validate for each directory and generate individual logs
    - |
      # Check if Terraform is installed
      terraform --version || { echo -e "\033[31m${TOOL_NAME} not found in project-tools.\033[0m"; exit 1; }

      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      for dir in "${DIRS[@]}"; do
        echo -e "\033[34mRunning ${TOOL_NAME} init in directory: $dir\n\033[0m"
        # Initialize Terraform in the directory (colored output in pipeline log)
        terraform -chdir="$dir" init -backend=false 2> >(tee temp.log >&2) || true

        # Process output from Terraform init and update exit code if issues are found
        if [[ -f temp.log && -s temp.log ]]; then
          echo -e "Running ${TOOL_NAME} validate in directory: $dir\n" >> "${LOG_FILE_PATH}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log | sed '/^╷$/d; /^╵$/d' | sed ':a;N;$!ba;s/\n$//' | sed -r 's/^│ //g' >> "${LOG_FILE_PATH}"
          EXIT_CODE=1  # Indicate that issues were found
        else
          echo -e "\033[32mNo issues were found during ${TOOL_NAME} init in the directory: $dir.\033[0m"
          echo -e "\033[34mRunning ${TOOL_NAME} validate in directory: $dir\n\033[0m"
          terraform -chdir="$dir" validate 2> >(tee temp.log >&2) || true
          if [[ -f temp.log && -s temp.log ]]; then
            echo -e "Running ${TOOL_NAME} validate in directory: $dir\n" >> "${LOG_FILE_PATH}"
            sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log | sed '/^╷$/d; /^╵$/d' | sed ':a;N;$!ba;s/\n$//' | sed -r 's/^│ //g' >> "${LOG_FILE_PATH}"
            EXIT_CODE=1  # Indicate that issues were found
          else
            echo -e "\033[32mNo issues were found during ${TOOL_NAME} validate in the directory: $dir.\033[0m"
          fi
        fi
      done

    # Determine action based on log file content
    - |
      if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" ]]; then
        cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
        if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
          echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the note with the log text.\033[0m"
          ACTION="both"
        else
          echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
          ACTION="post"
        fi
      else
        echo -e "\033[32mLog file is empty. No issues were found during ${TOOL_NAME} validate.\033[0m"
        echo "${TOOL_NAME} validation was successful. No issues were found." > "$PLAIN_TEXT_LOG"
        ACTION="post"
      fi

    # Post a comment with the results
    - bash "${CI_PROJECT_DIR}/scripts/upload_and_comment.sh" \
      "$VCS_PROVIDER" \
      "$ACTION" \
      "$LOG_FILE_PATH" \
      "$LOG_NAME" \
      "$AWS_S3_BUCKET" \
      "$CI_PROJECT_NAME" \
      "$CI_PROJECT_NAMESPACE" \
      "$CI_COMMIT_REF_NAME" \
      "$CI_COMMIT_SHA" \
      "$JOB_TOKEN" \
      "$CI_PROJECT_ID" \
      "$CI_PIPELINE_ID" \
      "$CI_MERGE_REQUEST_IID" \
      "$OIDC_ROLE_ARN" \
      "$TOOL_NAME" \
      "$PLAIN_TEXT_LOG" \
      "$CI_JOB_URL"

    # Fail the job if errors were found
    - |
      if [[ $EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31m${TOOL_NAME} validate analysis completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $RUN_TERRAFORM_VALIDATE =~ /^\s*true\s*$/i'

# Run Checkov analysis
checkov-analysis:
  stage: checkov-analysis
  extends: .path_and_auth
  dependencies:
    - setup
  variables:
    TOOL_NAME: "Checkov"
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE
  script:
    # Initialize variables for log file and tool name
    - LOG_NAME="checkov_analysis.log" # Log file for Checkov analysis stage
    - LOG_FILE_PATH="${CI_PROJECT_DIR}/${LOG_NAME}" # Path to log file for Checkov analysis stage
    - PLAIN_TEXT_LOG="${CI_PROJECT_DIR}/plain_text_log.txt" # Define the plain text log file path
    - AI_OUTPUT_LOG="${CI_PROJECT_DIR}/ai_output_log.txt" # Define the AI output log file path
    - CHECKOV_CONFIG="${CI_PROJECT_DIR}/.checkov.yaml" # Define the file path to the Checkov config

    # Split WORK_DIRS into an array
    - |
      echo "Checkov version:" && checkov --version || { echo -e "\033[31m${TOOL_NAME} not installed.\033[0m"; exit 1; }

      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      EXIT_CODE=0  # Initialize exit code
      MAX_EXIT_CODE=0
      TEMP_RESULTS_DIR="${CI_PROJECT_DIR}/result_logs"  # Define temporary results directory
      # Ensure the temporary results directory exists
      mkdir -p "$TEMP_RESULTS_DIR"
      for dir in "${DIRS[@]}"; do
        echo -e "\033[34mRunning ${TOOL_NAME} analysis in directory: $dir\n\033[0m"
        # Define temporary result file for the current directory
        TEMP_RESULT_FILE="${TEMP_RESULTS_DIR}/results_cli_${dir//\//_}.txt"
        # Run Checkov with colored output to pipeline via tee, capture to temp file
        CURRENT_EXIT_CODE=0
        checkov -d "$dir" --config-file "$CHECKOV_CONFIG" --quiet --framework terraform --download-external-modules false 2>&1 | tee "$TEMP_RESULT_FILE" || CURRENT_EXIT_CODE=${PIPESTATUS[0]}

        # Process results: any error level > 0 is recorded, and MAX_EXIT_CODE is updated
        if [[ $CURRENT_EXIT_CODE -gt 0 ]]; then
          echo -e "Running ${TOOL_NAME} analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$TEMP_RESULT_FILE" >> "${LOG_FILE_PATH}"
          if [[ $CURRENT_EXIT_CODE -gt $MAX_EXIT_CODE ]]; then
            MAX_EXIT_CODE=$CURRENT_EXIT_CODE  # Update the maximum error level
          fi
        else
          echo -e "\033[32mNo issues were found during ${TOOL_NAME} analysis in the directory: $dir.\033[0m"
        fi
      done

      # Set overall exit code based on the maximum error level
      EXIT_CODE=$MAX_EXIT_CODE
    - |
      if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" && $EXIT_CODE -gt 0 ]]; then
        # Errors found
        echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the note with the log text.\033[0m"
        cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
        if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
          ACTION="both"
        else
          echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
          ACTION="post"
        fi
      else
        # No errors found
        echo -e "\033[32mLog file is empty. No issues were found during ${TOOL_NAME} analysis.\033[0m"
        echo "${TOOL_NAME} analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
        ACTION="post"
      fi

    # Post a comment with the results
    - bash ${CI_PROJECT_DIR}/scripts/upload_and_comment.sh \
      "$VCS_PROVIDER" \
      "$ACTION" \
      "$LOG_FILE_PATH" \
      "$LOG_NAME" \
      "$AWS_S3_BUCKET" \
      "$CI_PROJECT_NAME" \
      "$CI_PROJECT_NAMESPACE" \
      "$CI_COMMIT_REF_NAME" \
      "$CI_COMMIT_SHA" \
      "$JOB_TOKEN" \
      "$CI_PROJECT_ID" \
      "$CI_PIPELINE_ID" \
      "$CI_MERGE_REQUEST_IID" \
      "$OIDC_ROLE_ARN" \
      "$TOOL_NAME" \
      "$PLAIN_TEXT_LOG" \
      "$CI_JOB_URL"

    # Fail the job if errors were found
    - |
      if [[ $EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31m${TOOL_NAME} analysis completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $RUN_CHECKOV_ANALYSIS =~ /^\s*true\s*$/i'

# Run TFSec analysis
tfsec-analysis:
  stage: tfsec-analysis
  extends: .path_and_auth
  dependencies:
    - setup
  variables:
    TOOL_NAME: "TFSec"
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE
  script:
    # Initialize variables for log file and tool name
    - LOG_NAME="tfsec_analysis.log" # Log file for TFsec analysis stage
    - LOG_FILE_PATH="${CI_PROJECT_DIR}/${LOG_NAME}" # Path to log file for TFsec analysis stage
    - PLAIN_TEXT_LOG="${CI_PROJECT_DIR}/plain_text_log.txt" # Define the plain text log file path
    - AI_OUTPUT_LOG="${CI_PROJECT_DIR}/ai_output_log.txt" # Define the AI output log file path

    # Split WORK_DIRS into an array
    - |
      echo -e "TFSec version:" && tfsec --version || { echo -e "\033[31m${TOOL_NAME} not installed..\033[0m"; exit 1; }
      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      EXIT_CODE=0  # Initialize exit code
      MAX_EXIT_CODE=0  # Track the maximum error level across all directories
      TEMP_RESULTS_DIR="${CI_PROJECT_DIR}/result_logs"  # Define temporary results directory
      # Ensure the temporary results directory exists
      mkdir -p "$TEMP_RESULTS_DIR"

      for dir in "${DIRS[@]}"; do
        echo -e "\033[34mRunning ${TOOL_NAME} analysis in directory: $dir\n\033[0m"
        # Define temporary result file for the current directory
        TEMP_RESULT_FILE="${TEMP_RESULTS_DIR}/results_cli_${dir//\//_}.txt"
        # Run TFSec with colored output to pipeline via tee
        CURRENT_EXIT_CODE=0
        tfsec "$dir" --no-module-downloads 2>&1 | tee "$TEMP_RESULT_FILE" || CURRENT_EXIT_CODE=${PIPESTATUS[0]}

        # Process results: any error level > 0 is recorded, and MAX_EXIT_CODE is updated
        if [[ $CURRENT_EXIT_CODE -gt 0 ]]; then
          echo -e "Running ${TOOL_NAME} analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$TEMP_RESULT_FILE" >> "${LOG_FILE_PATH}" 2>/dev/null || true
          if [[ $CURRENT_EXIT_CODE -gt $MAX_EXIT_CODE ]]; then
            MAX_EXIT_CODE=$CURRENT_EXIT_CODE  # Update the maximum error level
          fi
        else
          echo -e "\033[32mNo issues were found during ${TOOL_NAME} analysis in the directory: $dir.\033[0m"
        fi
      done

      # Set overall exit code based on the maximum error level
      EXIT_CODE=$MAX_EXIT_CODE
    - |
      if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" && $EXIT_CODE -gt 0 ]]; then
        # Errors found
        echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the note with the log text.\033[0m"
        cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
        if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
          ACTION="both"
        else
          echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
          ACTION="post"
        fi
      else
        # No errors found
        echo -e "\033[32mLog file is empty. No issues were found during ${TOOL_NAME} analysis.\033[0m"
        echo "${TOOL_NAME} analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
        ACTION="post"
      fi

    # Post a comment with the results
    - bash ${CI_PROJECT_DIR}/scripts/upload_and_comment.sh \
      "$VCS_PROVIDER" \
      "$ACTION" \
      "$LOG_FILE_PATH" \
      "$LOG_NAME" \
      "$AWS_S3_BUCKET" \
      "$CI_PROJECT_NAME" \
      "$CI_PROJECT_NAMESPACE" \
      "$CI_COMMIT_REF_NAME" \
      "$CI_COMMIT_SHA" \
      "$JOB_TOKEN" \
      "$CI_PROJECT_ID" \
      "$CI_PIPELINE_ID" \
      "$CI_MERGE_REQUEST_IID" \
      "$OIDC_ROLE_ARN" \
      "$TOOL_NAME" \
      "$PLAIN_TEXT_LOG" \
      "$CI_JOB_URL"

    # Fail the job if errors were found
    - |
      if [[ $EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31m${TOOL_NAME} analysis completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $RUN_TFSEC_ANALYSIS =~ /^\s*true\s*$/i'

# Run Trivy analysis for Terraform files
trivy-analysis:
  stage: trivy-analysis
  extends: .path_and_auth
  dependencies:
    - setup
  variables:
    TOOL_NAME: "Trivy"
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE
  script:
    # Initialize variables for log file and tool name
    - LOG_NAME="trivy_analysis.log" # Log file for Trivy analysis stage
    - LOG_FILE_PATH="${CI_PROJECT_DIR}/${LOG_NAME}" # Path to log file for Trivy analysis stage
    - PLAIN_TEXT_LOG="${CI_PROJECT_DIR}/plain_text_log.txt" # Define the plain text log file path
    - AI_OUTPUT_LOG="${CI_PROJECT_DIR}/ai_output_log.txt" # Define the AI output log file path

    # Split WORK_DIRS into an array
    - |
      echo -e "Trivy version:" && trivy --version || { echo -e "\033[31m${TOOL_NAME}  not installed..\033[0m"; exit 1; }
      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      EXIT_CODE=0  # Initialize exit code
      MAX_EXIT_CODE=0  # Track the maximum error level across all directories
      TEMP_RESULTS_DIR="${CI_PROJECT_DIR}/result_logs"  # Define temporary results directory
      # Ensure the temporary results directory exists
      mkdir -p "$TEMP_RESULTS_DIR"
      for dir in "${DIRS[@]}"; do
        echo -e "\033[34mRunning ${TOOL_NAME} analysis in directory: $dir\n\033[0m"
        # Define temporary result file for the current directory
        TEMP_RESULT_FILE="${TEMP_RESULTS_DIR}/results_cli_${dir//\//_}.txt"
        # Run Trivy with colored output to pipeline via tee
        CURRENT_EXIT_CODE=0
        trivy config "$dir" --exit-code 1 --severity HIGH,CRITICAL --format table 2>&1 | tee "$TEMP_RESULT_FILE" || CURRENT_EXIT_CODE=${PIPESTATUS[0]}

        # Process results: any error level > 0 is recorded, and MAX_EXIT_CODE is updated
        if [[ $CURRENT_EXIT_CODE -gt 0 ]]; then
          echo -e "Running ${TOOL_NAME} analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$TEMP_RESULT_FILE" >> "${LOG_FILE_PATH}"
          if [[ $CURRENT_EXIT_CODE -gt $MAX_EXIT_CODE ]]; then
            MAX_EXIT_CODE=$CURRENT_EXIT_CODE  # Update the maximum error level
          fi
        else
          echo -e "\033[32mNo issues were found during ${TOOL_NAME} analysis in the directory: $dir.\033[0m"
        fi
      done

      # Set overall exit code based on the maximum error level
      EXIT_CODE=$MAX_EXIT_CODE
    - |
      if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" && $EXIT_CODE -gt 0 ]]; then
        # Errors found
        echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the note with the log text.\033[0m"
        cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
        if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
          ACTION="both"
        else
          echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
          ACTION="post"
        fi
      else
        # No errors found
        echo -e "\033[32mLog file is empty. No issues were found during ${TOOL_NAME} analysis.\033[0m"
        echo "${TOOL_NAME} analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
        ACTION="post"
      fi

    # Post a comment with the results
    - bash ${CI_PROJECT_DIR}/scripts/upload_and_comment.sh \
      "$VCS_PROVIDER" \
      "$ACTION" \
      "$LOG_FILE_PATH" \
      "$LOG_NAME" \
      "$AWS_S3_BUCKET" \
      "$CI_PROJECT_NAME" \
      "$CI_PROJECT_NAMESPACE" \
      "$CI_COMMIT_REF_NAME" \
      "$CI_COMMIT_SHA" \
      "$JOB_TOKEN" \
      "$CI_PROJECT_ID" \
      "$CI_PIPELINE_ID" \
      "$CI_MERGE_REQUEST_IID" \
      "$OIDC_ROLE_ARN" \
      "$TOOL_NAME" \
      "$PLAIN_TEXT_LOG" \
      "$CI_JOB_URL"

    # Fail the job if errors were found
    - |
      if [[ $EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31m${TOOL_NAME} analysis completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $RUN_TRIVY_ANALYSIS =~ /^\s*true\s*$/i'

# Generate Terraform plan
terraform-plan:
  stage: terraform-plan
  extends: .path_and_auth
  dependencies:
    - setup
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE # Specify the audience for OIDC token (GitLab OIDC configuration)
  script:
    - set +e
    - LOG_NAME="terraform_plan.log" # Log file name for Terraform plan stage
    - LOG_FILE_PATH="${CI_PROJECT_DIR}/${LOG_NAME}" # Full path to the log file
    - PLAIN_TEXT_LOG="${CI_PROJECT_DIR}/plain_text_log.txt" # Define the plain text log file path
    - TOOL_NAME="Terraform plan"
    - EXIT_CODE=0
    - COMMENT_EXIT_CODE=0
    - |
      : > "$LOG_FILE_PATH"
      : > "$PLAIN_TEXT_LOG"

      # Check if Terraform is installed
      terraform --version || { echo -e "\033[31m${TOOL_NAME} not found in project-tools.\033[0m"; exit 1; }

      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      TARGET_DIR="${DIRS[0]}"
      if [[ ${#DIRS[@]} -gt 1 ]]; then
        echo -e "\033[33mTemporary limitation of the current product version: $TOOL_NAME processes only the first value from WORK_DIRS. Remaining directories will be ignored.\033[0m"
        echo -e "\033[33mIgnored directories:\033[0m"
        for ignored_dir in "${DIRS[@]:1}"; do
          echo -e "\033[33m - ${ignored_dir}\033[0m"
        done
      fi
      echo -e "\033[34mRunning $TOOL_NAME init in directory: $TARGET_DIR\033[0m"
      # Colored output in pipeline log; LOG_FILE_PATH is stripped of ANSI on the fly
      terraform -chdir="$TARGET_DIR" init -input=false $TERRAFORM_BACKEND_PARAMS 2>&1 | tee >(sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$LOG_FILE_PATH")
      EXIT_CODE=${PIPESTATUS[0]}

      if [[ $EXIT_CODE -eq 0 ]]; then
        terraform -chdir="$TARGET_DIR" plan -input=false 2>&1 | tee -a >(sed -r 's/\x1B\[[0-9;]*[mK]//g' >> "$LOG_FILE_PATH")
        EXIT_CODE=${PIPESTATUS[0]}
      fi

      if [[ $EXIT_CODE -eq 0 ]]; then
        echo -e "\033[32m$TOOL_NAME completed successfully.\033[0m"
      else
        echo -e "\033[31m$TOOL_NAME completed with errors.\033[0m"
      fi

      # LOG_FILE_PATH already stripped of ANSI; PLAIN_TEXT_LOG is a copy
      cp "$LOG_FILE_PATH" "$PLAIN_TEXT_LOG"
    # Post a comment with the results
    - ACTION="post"
    - bash ${CI_PROJECT_DIR}/scripts/upload_and_comment.sh \
      "$VCS_PROVIDER" \
      "$ACTION" \
      "$LOG_FILE_PATH" \
      "$LOG_NAME" \
      "$AWS_S3_BUCKET" \
      "$CI_PROJECT_NAME" \
      "$CI_PROJECT_NAMESPACE" \
      "$CI_COMMIT_REF_NAME" \
      "$CI_COMMIT_SHA" \
      "$JOB_TOKEN" \
      "$CI_PROJECT_ID" \
      "$CI_PIPELINE_ID" \
      "$CI_MERGE_REQUEST_IID" \
      "$OIDC_ROLE_ARN" \
      "$TOOL_NAME" \
      "$PLAIN_TEXT_LOG" \
      "$CI_JOB_URL"
    - COMMENT_EXIT_CODE=$?
    - |
      if [[ $COMMENT_EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31mFailed to publish $TOOL_NAME comment to MR.\033[0m"
        exit $COMMENT_EXIT_CODE
      fi
      if [[ $EXIT_CODE -ne 0 ]]; then
        echo -e "\033[31m$TOOL_NAME completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  allow_failure: false # Fail the pipeline if this stage fails
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $RUN_TERRAFORM_PLAN =~ /^\s*true\s*$/i' # Run on MR when plan is enabled
    # Post-merge apply path: rebuild plan on main before apply
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $RUN_TERRAFORM_APPLY =~ /^\s*true\s*$/i'

# Terraform apply
terraform-apply:
  stage: terraform-apply
  extends: .path_and_auth
  dependencies:
    - setup
  id_tokens:
    VCS_OIDC_TOKEN:
      aud: $OIDC_AUDIENCE # Specify the audience for OIDC token (GitLab OIDC configuration)
  script:
    - set +e
    - TOOL_NAME="Terraform apply"
    - EXIT_CODE=0
    - |
      # Check if Terraform is installed
      terraform --version || { echo -e "\033[31m${TOOL_NAME} not found in project-tools.\033[0m"; exit 1; }

      IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
      TARGET_DIR="${DIRS[0]}"
      if [[ ${#DIRS[@]} -gt 1 ]]; then
        echo -e "\033[33mTemporary limitation of the current product version: $TOOL_NAME processes only the first value from WORK_DIRS. Remaining directories will be ignored.\033[0m"
        echo -e "\033[33mIgnored directories:\033[0m"
        for ignored_dir in "${DIRS[@]:1}"; do
          echo -e "\033[33m - ${ignored_dir}\033[0m"
        done
      fi

      echo -e "\033[34mRunning $TOOL_NAME init with backend in directory: $TARGET_DIR\033[0m"
      terraform -chdir="$TARGET_DIR" init -input=false $TERRAFORM_BACKEND_PARAMS
      EXIT_CODE=$?

      if [[ $EXIT_CODE -eq 0 ]]; then
        echo -e "\033[34mRunning $TOOL_NAME in directory: $TARGET_DIR\033[0m"
        terraform -chdir="$TARGET_DIR" apply -input=false -auto-approve
        EXIT_CODE=$?
      fi

      if [[ $EXIT_CODE -eq 0 ]]; then
        echo -e "\033[32m$TOOL_NAME completed successfully.\033[0m"
      else
        echo -e "\033[31m$TOOL_NAME completed with errors. Failing the job.\033[0m"
        exit $EXIT_CODE
      fi
  allow_failure: false
  needs:
    # Provision tools; wait for plan completion without consuming its artifacts
    - job: setup
      artifacts: true
      optional: true
    - job: terraform-plan
      artifacts: false
      optional: true
  rules:
    # Post-merge pipeline on main; gated by global toggle, manual approval required
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $RUN_TERRAFORM_APPLY =~ /^\s*true\s*$/i'
      when: manual
      allow_failure: false
