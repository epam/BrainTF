name: CI Pipeline

on:
  pull_request: # Trigger pipeline on pull requests
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering of the workflow
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_DIRS:         "demo/broken" # Working directories for all stages
  # Utility versions
  TFLINT_VERSION:    "v0.60.0"     # TFLint version to install
  TERRAFORM_VERSION: "1.14.8"      # Terraform version to install
  CHECKOV_VERSION:   "3.2.524"     # Checkov version to install
  TFSEC_VERSION:     "v1.28.14"    # TFSec version to install
  TRIVY_VERSION:     "0.70.0"      # Trivy version to install

  # Automatically defined variables (Don't change anything, all variables are managed by Terraform only!!)
  AWS_S3_BUCKET:     "${{ vars.ARTIFACTS_BUCKET }}"  # AWS S3 bucket to upload logs
  VCS_API_ENDPOINT:  "${{ github.api_url }}"         # VCS API base URL (consumed by the script)
  OIDC_ROLE_ARN:     "${{ vars.OIDC_ROLE_ARN }}"     # The OIDC AWS Role ARN
  JOB_TOKEN:         "${{ secrets.JOB_TOKEN }}"      # The VCS token for API calls
  VCS_PROVIDER:      "${{ vars.VCS_PROVIDER }}"      # The VCS provider
  AI_HANDLER_CREATE: "${{ vars.AI_HANDLER_CREATE }}" # Enable or disable AI Handler
  GITHUB_RUN_URL:    "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"  # The run URL for  GitHub repository

jobs:
  validate-work-dirs:
    name: Validate WORK_DIRS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate WORK_DIRS directories
        shell: bash
        run: |
          echo -e "\033[34mValidating WORK_DIRS directories...\033[0m"
          CLEANED_WORK_DIRS="$(echo "$WORK_DIRS" | tr -d '[:space:]')"
          if [[ -z "$CLEANED_WORK_DIRS" ]]; then
            echo -e "\033[31mWORK_DIRS is empty. Please define at least one existing working directory.\033[0m"
            exit 1
          fi

          IFS=',' read -r -a DIRS <<< "$CLEANED_WORK_DIRS"
          VALID_DIR_COUNT=0
          MISSING_DIRS=()

          for dir in "${DIRS[@]}"; do
            [[ -z "$dir" ]] && continue
            VALID_DIR_COUNT=$((VALID_DIR_COUNT + 1))
            if [[ -d "$dir" ]]; then
              echo -e "\033[32mDirectory exists: $dir\033[0m"
            else
              echo -e "\033[31mDirectory does not exist: $dir\033[0m"
              MISSING_DIRS+=("$dir")
            fi
          done

          if [[ $VALID_DIR_COUNT -eq 0 ]]; then
            echo -e "\033[31mWORK_DIRS does not contain valid directory entries.\033[0m"
            exit 1
          fi

          if [[ ${#MISSING_DIRS[@]} -gt 0 ]]; then
            echo -e "\033[31mOne or more directories from WORK_DIRS do not exist. Failing the pipeline.\033[0m"
            printf 'Missing directories:\n - %s\n' "${MISSING_DIRS[@]}"
            exit 1
          fi

          echo -e "\033[32mAll directories from WORK_DIRS exist.\033[0m"

  setup:
    name: Setup Tools
    runs-on: ubuntu-latest
    needs:
      - validate-work-dirs
    outputs:
      source_sha: ${{ steps.get-sha.outputs.source_sha }} # Output variable for the next job
      setup_run: ${{ steps.setup-status.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: &tools-cache
          path: ~/.local
          key: tools-cache-v4-${{ env.TFLINT_VERSION }}-${{ env.TERRAFORM_VERSION }}-${{ env.CHECKOV_VERSION }}-${{ env.TFSEC_VERSION }}-${{ env.TRIVY_VERSION }}

      - name: Install Tools
        id: setup-status
        run: |
          echo -e "\033[34mChecking if tools are already cached...\033[0m"
          LOCAL_BIN="$HOME/.local/bin"
          export LOCAL_BIN
          if [ -x "$LOCAL_BIN/aws" ] && [ -x "$LOCAL_BIN/tflint" ] && [ -x "$LOCAL_BIN/terraform" ] && [ -x "$LOCAL_BIN/checkov" ] && [ -x "$LOCAL_BIN/tfsec" ] && [ -x "$LOCAL_BIN/trivy" ] && [ -x "$LOCAL_BIN/jq" ]; then
            echo -e "\033[32mTools are already cached. Skipping installation.\033[0m"
            exit 0
          fi

          echo -e "\033[34mInstalling tools...\033[0m"
          mkdir -p "$LOCAL_BIN"

          # Install AWS CLI version 2
          echo -e "\033[34mInstalling AWS CLI version 2...\033[0m"
          curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q -o awscliv2.zip
          ./aws/install --bin-dir "$LOCAL_BIN" --install-dir "$HOME/.local/aws"
          rm -rf aws awscliv2.zip
          echo -e "\033[32mAWS CLI installed successfully.\033[0m"

          # Install TFLint
          echo -e "\033[34mInstalling TFLint...\033[0m"
          curl -sL https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip -o tflint.zip
          unzip -q -o tflint.zip
          mv tflint "$LOCAL_BIN/tflint"
          rm tflint.zip
          echo -e "\033[32mTFLint installed successfully.\033[0m"

          # Install Terraform
          echo -e "\033[34mInstalling Terraform...\033[0m"
          curl -sS https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip -o /tmp/terraform.zip
          unzip -q -o /tmp/terraform.zip -d /tmp/terraform-install
          mv /tmp/terraform-install/terraform "$LOCAL_BIN/terraform"
          rm -rf /tmp/terraform.zip /tmp/terraform-install
          echo -e "\033[32mTerraform installed successfully.\033[0m"

          # Install OpenAI Python library
          echo -e "\033[34mInstalling OpenAI Python library...\033[0m"
          pip install --upgrade pip
          pip install -q --user openai
          echo -e "\033[32mOpenAI library installed successfully.\033[0m"

          # Install Checkov
          echo -e "\033[34mInstalling Checkov...\033[0m"
          pip install -q --user checkov==${CHECKOV_VERSION}
          echo -e "\033[32mCheckov installed successfully.\033[0m"

          # Install TFsec
          echo -e "\033[34mInstalling TFsec...\033[0m"
          curl -L https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64 -o "$LOCAL_BIN/tfsec"
          chmod +x "$LOCAL_BIN/tfsec"
          echo -e "\033[32mTFsec installed successfully.\033[0m"

          # Install Trivy
          echo -e "\033[34mInstalling Trivy...\033[0m"
          curl -L https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          mv trivy "$LOCAL_BIN/trivy"
          rm trivy.tar.gz
          chmod +x "$LOCAL_BIN/trivy"
          echo -e "\033[32mTrivy installed successfully.\033[0m"

          # Install jq
          echo -e "\033[34mInstalling jq...\033[0m"
          curl -L https://github.com/jqlang/jq/releases/latest/download/jq-linux-amd64 -o "$LOCAL_BIN/jq"
          chmod +x "$LOCAL_BIN/jq"
          echo -e "\033[32mjq installed successfully.\033[0m"

          # Verify installed tools
          echo -e "\033[34mVerifying installed tools:\033[0m"
          echo -n "AWS CLI Version: "; aws --version || { echo "AWS CLI installation failed"; exit 1; }
          tflint --version || { echo "TFLint installation failed"; exit 1; }
          terraform version || { echo "Terraform installation failed"; exit 1; }
          python -c "import openai; print('OpenAI version:', openai.__version__)" || { echo "OpenAI library is not installed"; exit 1; }
          echo -n "Checkov Version: "; checkov --version || { echo "Checkov installation failed"; exit 1; }
          echo -n "TFsec Version: "; tfsec --version || { echo "TFsec installation failed"; exit 1; }
          echo -n "Trivy "; trivy --version || { echo "Trivy installation failed"; exit 1; }
          jq --version || { echo "jq installation failed"; exit 1; }

      - name: Get Source Commit SHA
        id: get-sha
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "source_sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "source_sha=$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi

  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    needs:
      - setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Terraform Format Check
        run: |
          echo "Starting Terraform format check..."
          terraform fmt -check -recursive || { echo -e "\033[31mTerraform files are not properly formatted. Please run 'terraform fmt -recursive' locally and update your pull request.\033[0m"; exit 1; }
          echo -e "\033[32mTerraform format check passed. All files are properly formatted.\033[0m"

  tflint-analysis:
    name: TFLint Analysis
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
    if: ${{ contains(vars.RUN_TFLINT_ANALYSIS, 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: TFLint Analysis
        run: |
          echo "Starting TFLint analysis..."

          # Define paths for logs
          LOG_NAME="tflint_analysis.log"
          PLAIN_TEXT_LOG="$GITHUB_WORKSPACE/plain_text_log.txt"
          LOG_FILE_PATH="$GITHUB_WORKSPACE/${LOG_NAME}"
          GITHUB_SHA="${{ needs.setup.outputs.source_sha }}"
          TOOL_NAME="TFLint"
          EXIT_CODE="0"

          tflint --version || { echo -e "\033[31m$TOOL_NAME not found.\033[0m"; exit 1; }
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl" || { echo -e "\033[31mFailed to initialize $TOOL_NAME.\033[0m"; exit 1; }

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          for dir in "${DIRS[@]}"; do
            echo -e "\033[34mRunning $TOOL_NAME analysis in directory: $dir\n\033[0m"

            tflint --force --chdir="$dir" 2>&1 | tee temp.log || true

            # Process output and update exit code if issues are found
            if [[ -f temp.log && -s temp.log ]]; then
              echo -e "Running $TOOL_NAME analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
              sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log >> "${LOG_FILE_PATH}"
              EXIT_CODE=1  # Indicate that issues were found
            else
              echo -e "\033[32mNo issues were found during $TOOL_NAME analysis in the directory: $dir.\033[0m"
            fi
          done

          # Determine action based on log content
          if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" ]]; then
            cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
            if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
              echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the comment with the log text.\033[0m"
              ACTION="both"
            else
              echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
              ACTION="post"
            fi
          else
            echo -e "\033[32mLog file is empty. No issues were found during $TOOL_NAME analysis.\033[0m"
            echo "$TOOL_NAME analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
            ACTION="post"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Post a comment with the results
          bash "$GITHUB_WORKSPACE/scripts/upload_and_comment.sh" \
            "$VCS_PROVIDER" \
            "$ACTION" \
            "$LOG_FILE_PATH" \
            "$LOG_NAME" \
            "$AWS_S3_BUCKET" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_SHA" \
            "$JOB_TOKEN" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            "$PR_NUMBER" \
            "$OIDC_ROLE_ARN" \
            "$TOOL_NAME" \
            "$PLAIN_TEXT_LOG" \
            "$GITHUB_RUN_URL"

          # Fail the job if errors were found
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME analysis completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TERRAFORM_VALIDATE, 'true') && needs.tflint-analysis.result != 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Validate
        run: |
          echo "Starting Terraform validation..."

          # Define paths for logs
          LOG_NAME="terraform_validate.log"
          PLAIN_TEXT_LOG="$GITHUB_WORKSPACE/plain_text_log.txt"
          LOG_FILE_PATH="$GITHUB_WORKSPACE/${LOG_NAME}"
          GITHUB_SHA="${{ needs.setup.outputs.source_sha }}"
          TOOL_NAME="Terraform"
          EXIT_CODE="0"

          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

          echo Check if ${TOOL_NAME} is installed
          terraform --version || { echo -e "\033[31m$TOOL_NAME not found.\033[0m"; exit 1; }

          # Run Terraform validate for each directory in WORK_DIRS
          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          for dir in "${DIRS[@]}"; do
            echo -e "\033[34mRunning $TOOL_NAME init in directory: $dir\n\033[0m"
            # Colored output in pipeline log via stderr; temp.log captures errors for artifact
            terraform -chdir="$dir" init -backend=false 2> >(tee temp.log >&2) || true
            # Process output from Terraform init and update exit code if issues are found
            if [[ -f temp.log && -s temp.log ]]; then
              echo -e "Running $TOOL_NAME validate in directory: $dir\n" >> "${LOG_FILE_PATH}"
              sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log | sed '/^╷$/d; /^╵$/d' | sed ':a;N;$!ba;s/\n$//' | sed -r 's/^│ //g' >> "${LOG_FILE_PATH}"
              EXIT_CODE=1 # Indicate that issues were found
            else
              echo -e "\033[32mNo issues were found during $TOOL_NAME init in the directory: $dir.\033[0m"
              echo -e "\033[34mRunning $TOOL_NAME validate in directory: $dir\n\033[0m"
              terraform -chdir="$dir" validate 2> >(tee temp.log >&2) || true
              if [[ -f temp.log && -s temp.log ]]; then
                echo -e "Running $TOOL_NAME validate in directory: $dir\n" >> "${LOG_FILE_PATH}"
                sed -r 's/\x1B\[[0-9;]*[mK]//g' temp.log | sed '/^╷$/d; /^╵$/d' | sed ':a;N;$!ba;s/\n$//' | sed -r 's/^│ //g' >> "${LOG_FILE_PATH}"
                EXIT_CODE=1  # Indicate that issues were found
              else
                echo -e "\033[32mNo issues were found during $TOOL_NAME validate in the directory: $dir.\033[0m"
              fi
            fi
          done

          # Determine action based on log content
          if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" ]]; then
            cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
            if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
              echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the comment with the log text.\033[0m"
              ACTION="both"
            else
              echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
              ACTION="post"
            fi
          else
            echo -e "\033[32mLog file is empty. No issues were found during $TOOL_NAME validation.\033[0m"
            echo "$TOOL_NAME validation was successful. No issues were found." > "$PLAIN_TEXT_LOG"
            ACTION="post"
          fi

          PR_NUMBER=${{ github.event.pull_request.number }}

          # Post a comment with the results
          bash "$GITHUB_WORKSPACE/scripts/upload_and_comment.sh" \
            "$VCS_PROVIDER" \
            "$ACTION" \
            "$LOG_FILE_PATH" \
            "$LOG_NAME" \
            "$AWS_S3_BUCKET" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_SHA" \
            "$JOB_TOKEN" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            "$PR_NUMBER" \
            "$OIDC_ROLE_ARN" \
            "$TOOL_NAME" \
            "$PLAIN_TEXT_LOG" \
            "$GITHUB_RUN_URL"

          # Fail the job if errors were found
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME validation completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

  checkov-analysis:
    name: Checkov Analysis
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
    if: ${{ !cancelled() && contains(vars.RUN_CHECKOV_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run Checkov Analysis
        shell: bash
        env:
          TOOL_NAME: Checkov
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
        run: |
          echo "Starting Checkov analysis..."

          # Initialize variables for log file and tool name
          LOG_NAME="checkov_analysis.log"
          LOG_FILE_PATH="${GITHUB_WORKSPACE}/${LOG_NAME}"
          PLAIN_TEXT_LOG="${GITHUB_WORKSPACE}/plain_text_log.txt"
          CHECKOV_CONFIG="${GITHUB_WORKSPACE}/.checkov.yaml"
          GITHUB_SHA="${SOURCE_SHA}"

          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

          echo "Checkov version:" && checkov --version || { echo -e "\033[31m$TOOL_NAME not installed.\033[0m"; exit 1; }

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          EXIT_CODE=0
          MAX_EXIT_CODE=0
          TEMP_RESULTS_DIR="${GITHUB_WORKSPACE}/result_logs"

          # Ensure the temporary results directory exists
          mkdir -p "$TEMP_RESULTS_DIR"

          for dir in "${DIRS[@]}"; do
            echo -e "\033[34mRunning $TOOL_NAME analysis in directory: $dir\n\033[0m"

            # Define temporary result file for the current directory
            TEMP_RESULT_FILE="${TEMP_RESULTS_DIR}/results_cli_${dir//\//_}.txt"

            CURRENT_EXIT_CODE=0
            checkov -d "$dir" --config-file "$CHECKOV_CONFIG" --quiet --framework terraform --download-external-modules false 2>&1 | tee "$TEMP_RESULT_FILE" || CURRENT_EXIT_CODE=${PIPESTATUS[0]}

            # Process results: any error level > 0 is recorded, and MAX_EXIT_CODE is updated
            if [[ $CURRENT_EXIT_CODE -gt 0 ]]; then
              echo -e "Running $TOOL_NAME analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$TEMP_RESULT_FILE" >> "${LOG_FILE_PATH}"
              if [[ $CURRENT_EXIT_CODE -gt $MAX_EXIT_CODE ]]; then
                MAX_EXIT_CODE=$CURRENT_EXIT_CODE
              fi
            else
              echo -e "\033[32mNo issues were found during $TOOL_NAME analysis in the directory: $dir.\033[0m"
            fi
          done

          EXIT_CODE=$MAX_EXIT_CODE

          if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" && $EXIT_CODE -gt 0 ]]; then
            echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the comment with the log text.\033[0m"
            cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
            if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
              ACTION="both"
            else
              echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
              ACTION="post"
            fi
          else
            echo -e "\033[32mLog file is empty. No issues were found during $TOOL_NAME analysis.\033[0m"
            echo "$TOOL_NAME analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
            ACTION="post"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Post a comment with the results
          bash "${GITHUB_WORKSPACE}/scripts/upload_and_comment.sh" \
            "$VCS_PROVIDER" \
            "$ACTION" \
            "$LOG_FILE_PATH" \
            "$LOG_NAME" \
            "$AWS_S3_BUCKET" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_SHA" \
            "$JOB_TOKEN" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            "$PR_NUMBER" \
            "$OIDC_ROLE_ARN" \
            "$TOOL_NAME" \
            "$PLAIN_TEXT_LOG" \
            "$GITHUB_RUN_URL"

          # Fail the job if errors were found
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME analysis completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

  tfsec-analysis:
    name: TFsec Analysis
    runs-on: ubuntu-latest
    needs:
      - setup
      - terraform-fmt
      - tflint-analysis
      - terraform-validate
      - checkov-analysis
    if: ${{ !cancelled() && contains(vars.RUN_TFSEC_ANALYSIS, 'true') && needs.tflint-analysis.result != 'failure' && needs.terraform-validate.result != 'failure' && needs.checkov-analysis.result != 'failure' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Tools Cache
        uses: actions/cache@v5
        id: cache-tools
        with: *tools-cache

      - name: Assume AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          audience: ${{ vars.OIDC_AUDIENCE }}
          role-session-name: VCSRunner-role-${{ github.event.repository.name }}-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run TFSec Analysis
        run: |
          echo "Starting TFSec analysis..."

          LOG_NAME="tfsec_analysis.log"
          LOG_FILE_PATH="$GITHUB_WORKSPACE/${LOG_NAME}"
          PLAIN_TEXT_LOG="$GITHUB_WORKSPACE/plain_text_log.txt"
          GITHUB_SHA="${{ needs.setup.outputs.source_sha }}"
          TOOL_NAME="TFSec"
          EXIT_CODE=0
          MAX_EXIT_CODE=0
          TEMP_RESULTS_DIR="$GITHUB_WORKSPACE/result_logs"
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

          tfsec --version || { echo -e "\033[31m$TOOL_NAME not found.\033[0m"; exit 1; }
          mkdir -p "$TEMP_RESULTS_DIR"

          IFS=',' read -r -a DIRS <<< "$(echo "$WORK_DIRS" | tr -d ' ')"
          for dir in "${DIRS[@]}"; do
            echo -e "\033[34mRunning $TOOL_NAME analysis in directory: $dir\n\033[0m"
            TEMP_RESULT_FILE="${TEMP_RESULTS_DIR}/results_cli_${dir//\//_}.txt"
            CURRENT_EXIT_CODE=0
            tfsec "$dir" --no-module-downloads 2>&1 | tee "$TEMP_RESULT_FILE" || CURRENT_EXIT_CODE=${PIPESTATUS[0]}
            if [[ $CURRENT_EXIT_CODE -gt 0 ]]; then
              echo -e "Running $TOOL_NAME analysis in directory: $dir\n" >> "${LOG_FILE_PATH}"
              sed -r 's/\x1B\[[0-9;]*[mK]//g' "$TEMP_RESULT_FILE" >> "${LOG_FILE_PATH}" 2>/dev/null || true
              if [[ $CURRENT_EXIT_CODE -gt $MAX_EXIT_CODE ]]; then
                MAX_EXIT_CODE=$CURRENT_EXIT_CODE
              fi
            else
              echo -e "\033[32mNo issues were found during $TOOL_NAME analysis in the directory: $dir.\033[0m"
            fi
          done

          EXIT_CODE=$MAX_EXIT_CODE

          if [[ -f "$LOG_FILE_PATH" && -s "$LOG_FILE_PATH" && $EXIT_CODE -gt 0 ]]; then
            echo -e "\033[31mLog file contains errors.\033[0m \033[34mProceeding with posting the comment with the log text.\033[0m"
            cat "$LOG_FILE_PATH" >> "$PLAIN_TEXT_LOG"
            if [[ "$AI_HANDLER_CREATE" == "true" ]]; then
              ACTION="both"
            else
              echo -e "\033[33mLog file contains errors, but AI handler is disabled.\033[0m \033[34mProceeding with posting the log text only.\033[0m"
              ACTION="post"
            fi
          else
            echo -e "\033[32mLog file is empty. No issues were found during $TOOL_NAME analysis.\033[0m"
            echo "$TOOL_NAME analysis was successful. No issues were found." > "$PLAIN_TEXT_LOG"
            ACTION="post"
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Post a comment with the results
          bash "${GITHUB_WORKSPACE}/scripts/upload_and_comment.sh" \
            "$VCS_PROVIDER" \
            "$ACTION" \
            "$LOG_FILE_PATH" \
            "$LOG_NAME" \
            "$AWS_S3_BUCKET" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REPOSITORY_OWNER" \
            "$GITHUB_HEAD_REF" \
            "$GITHUB_SHA" \
            "$JOB_TOKEN" \
            "$GITHUB_REF" \
            "$GITHUB_RUN_ID" \
            "$PR_NUMBER" \
            "$OIDC_ROLE_ARN" \
            "$TOOL_NAME" \
            "$PLAIN_TEXT_LOG" \
            "$GITHUB_RUN_URL"

          # Fail the job if errors were found
          if [[ $EXIT_CODE -ne 0 ]]; then
            echo -e "\033[31m$TOOL_NAME analysis completed with errors. Failing the job.\033[0m"
            exit $EXIT_CODE
          fi

